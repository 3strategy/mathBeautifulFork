<svg xmlns="http://www.w3.org/2000/svg" width="580" height="410" viewBox="0 0 290 205" role="img" aria-labelledby="title desc">
  <title id="title">Right triangle ABC</title>
  <desc id="desc">The right angle is at B. D lies on BC and E lies on AC. Segments AD and BE intersect inside the triangle.</desc>
  <style>
    :root { color: #101010; }
    @media (prefers-color-scheme: dark) {
      :root { color: #e0e0e0; }
    }
  </style>
  <g fill="none" stroke="currentColor" stroke-linejoin="round">
    <path d="M27 155.5 H45 V173.5" stroke-width="1"/>
    <path d="M27 34 L263 173.5 H27 Z" stroke-width="2.1"/>
    <path d="M27 34 L107 173.5 M27 173.5 L145 103.75" stroke-width="1.9"/>
  </g>
  <g font-family="Times New Roman, Liberation Serif, serif" font-size="19" fill="currentColor">
    <text x="20" y="28">A</text><text x="21" y="192">B</text>
    <text x="259" y="192">C</text><text x="103" y="192">D</text>
    <text x="150" y="102">E</text>
  </g>
</svg>
